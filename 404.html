<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <title>Redirigiendo…</title>
  <script>
    // La app usa rutas con # (HashRouter) bajo /ordenesPedidoSW/.
    var base = '/ordenesPedidoSW/';
    var ruta = window.location.pathname.indexOf(base) === 0 ? window.location.pathname.slice(base.length) : '';
    window.location.replace(base + '#/' + ruta + window.location.search);
  </script>
</head>
<body><p>Redirigiendo…</p></body>
</html>
