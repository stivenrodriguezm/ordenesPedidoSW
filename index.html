    <script>
      // Modo diurno/nocturno guardado en este equipo: se aplica antes de pintar (sin parpadeo).
      try {
        var tema = localStorage.getItem('lottus-tema');
        if (tema === 'nocturno') {
          document.documentElement.dataset.tema = 'nocturno';
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#000000');
        } else {
          document.documentElement.dataset.tema = 'diurno';
        }
      } catch (e) { document.documentElement.dataset.tema = 'diurno'; }
    </script>
