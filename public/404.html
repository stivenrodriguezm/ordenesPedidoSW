<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    <script>
        var path = window.location.pathname;
        if (path.startsWith('/')) {
            path = path.substring(1);
        }
        window.location.replace("/#/" + path + window.location.search);
    </script>
</head>
<body>
    <p>Redirigiendo...</p>
</body>
</html>
